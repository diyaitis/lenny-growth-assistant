services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: lenny
      POSTGRES_DB: lenny_growth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny_growth"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://lenny:lenny@db:5432/lenny_growth
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5-20250929}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      # host.docker.internal resolves to the host machine from inside the
      # container on Docker Desktop (Mac/Windows) and, thanks to
      # `extra_hosts` below, on Linux too — this is how the backend reaches
      # `ollama serve` running natively on your machine rather than in a
      # container (pulling multi-GB models into a fresh container on every
      # `up` is worse for a take-home demo than "run ollama the normal way").
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-600}
      SHIP30_MAX_OUTPUT_TOKENS: ${SHIP30_MAX_OUTPUT_TOKENS:-1800}
      ARTIFACT_MAX_OUTPUT_TOKENS: ${ARTIFACT_MAX_OUTPUT_TOKENS:-2500}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-6}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.35}
      CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-280}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-40}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      SHIP30_TARGET_WORDS: ${SHIP30_TARGET_WORDS:-1250}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      # Mounted at /data/transcripts (not /app/data/...) so that
      # `scripts/ingest.py`'s default path — resolved relative to its own
      # file location, three levels up to a sibling `data/` dir, exactly like
      # it is in the repo checkout (backend/scripts/../.. == repo root) —
      # resolves to the same place inside the container without special-
      # casing "am I in Docker" anywhere in application code.
      - ./data/transcripts:/data/transcripts:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
